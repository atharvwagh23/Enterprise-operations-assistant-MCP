[project]
name = "enterprise-operations-assistant-mcp"
version = "0.1.0"
description = "A learning project demonstrating MCP, Groq tool calling, and simulated enterprise systems."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "groq>=0.30.0",
    "mcp>=1.28,<2",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
]

[project.scripts]
enterprise-operations-assistant-mcp = "enterprise_operations_assistant_mcp:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
